[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + LangChain backend for the local RAG chatbot"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "minio>=7.2.20",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
# ragas only uses scikit-network for synthetic test-set generation (not used here),
# and it has no Python 3.14 Windows wheel, so skip it.
override-dependencies = ["scikit-network; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "langchain-community>=0.4,<0.4.2",
    "ragas>=0.4.3",
]
test = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# pyflakes + syntax errors + import order + common bug patterns (bugbear)
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]  # FastAPI's `user: User = CurrentUser` is the intended Depends() idiom
