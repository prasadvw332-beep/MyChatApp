# nginx inside the frontend container.
#   /        -> the static files built by Vite
#   /api/... -> the backend (the /api prefix is removed: /api/chat -> backend /chat)
#
# "backend" is a hostname. In docker-compose it is the service name in
# docker-compose.yml; in Kubernetes it is the Service name in deploy/k8s/backend-service.yaml.
# Both give containers a built-in DNS that resolves service names to IPs.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads up to the backend's MAX_UPLOAD_MB (20) plus some room
    client_max_body_size 25m;

    location /api/ {
        # trailing slash on proxy_pass = strip the /api/ prefix
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat replies are streamed token by token; don't hold them back in a buffer
        proxy_buffering off;
        proxy_read_timeout 300s;  # a small CPU model can be slow to answer
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
