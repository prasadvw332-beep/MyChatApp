<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="auth" hidden>
  <form id="auth-form" class="auth-card">
    <div class="hero-mark">✦</div>
    <h1 id="auth-title">Log in</h1>
    <label>Username<input id="auth-username" autocomplete="username" required minlength="3" maxlength="32" spellcheck="false" autocapitalize="none"></label>
    <label>Password<input id="auth-password" type="password" autocomplete="current-password" required minlength="1" maxlength="128"></label>
    <p id="auth-error" class="auth-error" role="alert"></p>
    <button id="auth-submit" class="btn primary" type="submit">Log in</button>
    <p class="auth-foot"><span id="auth-switch-text">No account?</span> <button id="auth-switch" class="link" type="button">Sign up</button></p>
  </form>
</div>
<div id="layout" hidden>
  <aside id="sidebar" aria-label="Sidebar">
    <div class="side-head">
      <div class="brand"><span class="mark">✦</span><span>My Chatbot</span></div>
      <button id="collapse" class="icon-btn" type="button" title="Close sidebar" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>

    <div class="side-actions">
      <button id="newchat" class="side-btn" type="button">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span>New chat</span><kbd>Ctrl ⇧ O</kbd>
      </button>
      <button id="evals-btn" class="side-btn" type="button">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        <span>Evaluation</span>
      </button>
      <label class="side-search">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="chatsearch" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
      </label>
    </div>

    <nav id="chatlist" class="side-scroll" aria-label="Chat history"></nav>

    <section id="docs" class="docs" aria-label="Knowledge base">
      <div class="docs-head">
        <button id="docs-toggle" class="docs-title" type="button" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          <span>Knowledge base</span>
          <span id="doccount" class="count">0</span>
        </button>
        <button id="upload" class="icon-btn sm" type="button" title="Upload documents" aria-label="Upload documents">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="doclist" class="docs-body"></div>
    </section>

    <div class="side-user">
      <span id="whoami" class="who"></span>
      <button id="logout" class="link" type="button">Log out</button>
    </div>
  </aside>
  <div id="backdrop"></div>

  <div id="app">
    <header>
      <button id="menu" class="icon-btn" type="button" title="Open sidebar" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <div class="model"><span class="dot"></span>llama3.2<span class="muted">· RAG</span></div>
      <div class="spacer"></div>
      <button id="theme" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <main id="messages">
      <div id="welcome">
        <div class="hero-mark">✦</div>
        <h1>How can I help you today?</h1>
        <p>Ask anything, or upload documents and I'll answer from them with sources.</p>
        <div class="suggestions">
          <button type="button" class="suggestion" data-prompt="Summarize the uploaded documents in 5 key bullet points">
            <strong>Summarize my documents</strong><span>in 5 key bullet points</span>
          </button>
          <button type="button" class="suggestion" data-prompt="Explain AI in simple words">
            <strong>Explain a concept</strong><span>AI in simple words</span>
          </button>
          <button type="button" class="suggestion" data-prompt="Write a Python function to reverse a string">
            <strong>Write code</strong><span>a Python function to reverse a string</span>
          </button>
          <button type="button" class="suggestion" data-prompt="Give me a 4-week study plan for learning RAG as a table">
            <strong>Make a plan</strong><span>a 4-week study plan as a table</span>
          </button>
        </div>
      </div>
    </main>

    <main id="evals" aria-label="Evaluation" hidden></main>

    <div class="composer-wrap">
      <button id="tobottom" type="button" title="Scroll to bottom" aria-label="Scroll to bottom">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      </button>
      <form id="form" class="composer">
        <textarea id="input" rows="1" placeholder="Message My Chatbot…" aria-label="Message" autofocus></textarea>
        <div class="composer-bar">
          <button id="attach" class="icon-btn" type="button" title="Upload documents (PDF, TXT, MD)" aria-label="Upload documents">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <div class="spacer"></div>
          <button id="send" type="submit" title="Send" aria-label="Send" disabled>
            <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
          </button>
        </div>
      </form>
      <p class="disclaimer">Runs locally with Ollama. Answers can be wrong, so check the cited sources.</p>
    </div>
  </div>
</div>

<div id="dropzone">
  <div>
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    <strong>Drop files to add to the knowledge base</strong>
    <span>PDF, TXT or MD</span>
  </div>
</div>
<input id="file" type="file" accept=".pdf,.txt,.md" multiple hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
