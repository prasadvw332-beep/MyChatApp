# A Secret is like a ConfigMap but for passwords and keys. Kubernetes keeps it
# separate so access can be restricted (RBAC) and it isn't printed by default.
#
# "stringData" lets us write plain text; Kubernetes stores it base64-encoded.
# Base64 is NOT encryption! Never commit real secrets to git. In real projects
# create them from the command line or a secret manager, e.g.:
#   kubectl create secret generic backend-secrets -n mychatapp \
#     --from-literal=JWT_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))") ...
# On AWS you would use AWS Secrets Manager + the External Secrets Operator.
#
# These are the same local-development values as backend/.env.example.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: mychatapp
type: Opaque
stringData:
  # used by the backend
  DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/mychatapp"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
  # All backend replicas must share the same JWT secret, otherwise a login made on
  # pod A is rejected by pod B. That's one reason it lives here and not in the image.
  JWT_SECRET: "change-me-to-a-long-random-string-before-real-use"
  # used by the postgres and minio pods
  POSTGRES_PASSWORD: "postgres"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"
---
# Separate from backend-secrets, which every backend pod loads whole as env variables:
# the backend has no business knowing the Grafana admin password.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: mychatapp
type: Opaque
stringData:
  GRAFANA_ADMIN_PASSWORD: "admin"
