# A ConfigMap holds NON-secret settings as key/value pairs. The backend Deployment
# loads all of them as environment variables (see envFrom in backend-deployment.yaml),
# which is exactly what app/core/config.py reads with os.getenv().
#
# Hostnames like "ollama" or "qdrant" are Service names: Kubernetes DNS resolves
# them to the right pods. (Full name: qdrant.mychatapp.svc.cluster.local)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: mychatapp
data:
  OLLAMA_URL: "http://ollama:11434"
  CHAT_MODEL: "llama3.2:1b"
  EMBED_MODEL: "nomic-embed-text"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "documents_v2"
  MIN_SCORE: "0.58"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "documents"
  CORS_ORIGINS: "http://localhost"
  SESSION_DAYS: "7"
  COOKIE_SECURE: "false"   # set "true" once the site is served over https
