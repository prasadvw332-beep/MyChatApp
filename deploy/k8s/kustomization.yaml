# Lets you apply every file at once, in a sensible order (Namespace first):
#   kubectl apply -k deploy/k8s/
# Kustomize is built into kubectl. Later it can also patch these files per
# environment (dev / prod) without copying them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - qdrant.yaml
  - minio.yaml
  - ollama.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - worker-deployment.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  # Prometheus, Grafana, Tempo and the OpenTelemetry Collector (with their config files)
  - ../observability
