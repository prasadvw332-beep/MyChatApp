# Ingestion workers: pods that pull queued documents from PostgreSQL and index them
# (download from MinIO -> chunk -> embed with Ollama -> store in Qdrant).
#
# Same image as the backend, different command. Notice what is NOT here:
#   - no Service: workers receive no traffic, they PULL work from the queue
#   - no readiness probe, and only one port: Prometheus scraping metrics (headless Service worker-metrics)
#   - no `replicas:`: the HorizontalPodAutoscaler in autoscaling.yaml scales them (2 to 8)
#
# Any number can run at once; the queue makes sure no document is processed twice. To pin a count
# by hand, change the HPA (kubectl scale would be undone by it):
#   kubectl patch hpa worker -n mychatapp -p '{"spec":{"minReplicas":5,"maxReplicas":5}}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mychatapp
  labels:
    app: worker
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # On scale-down or a new rollout, Kubernetes sends SIGTERM and waits this long before
      # SIGKILL. The worker uses that time to finish the document it is working on.
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: mychatapp-backend:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.ingestion.worker"]
          ports:
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            - name: EMBED_BATCH_SIZE
              value: "64"
            - name: OTEL_SERVICE_NAME
              value: mychatapp-worker
          resources:
            requests:
              cpu: 250m          # PDF text extraction and chunking run here
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi        # one document (max 20 MB) at a time
