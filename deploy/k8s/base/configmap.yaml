# A ConfigMap holds NON-secret settings as key/value pairs. The backend Deployment
# loads all of them as environment variables (see envFrom in backend-deployment.yaml),
# which is exactly what app/core/config.py reads with os.getenv().
#
# Hostnames like "ollama" or "qdrant" are Service names: Kubernetes DNS resolves
# them to the right pods. (Full name: qdrant.mychatapp.svc.cluster.local)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: mychatapp
data:
  # "production" makes the backend refuse to start with dev passwords or COOKIE_SECURE=false
  # (app/core/config.py validate()). The prod overlay switches it on (overlays/prod/production.yaml).
  APP_ENV: "development"
  LOG_LEVEL: "INFO"
  OLLAMA_URL: "http://ollama:11434"
  CHAT_MODEL: "llama3.2:1b"
  AGENT_MODEL: "llama3.2:1b"
  EMBED_MODEL: "nomic-embed-text"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "documents_v2"
  MIN_SCORE: "0.58"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "documents"
  CORS_ORIGINS: "http://localhost"
  SESSION_DAYS: "7"
  COOKIE_SECURE: "false"   # set "true" once the site is served over https
  # traces go to the collector (deploy/observability/); metrics are scraped from port 9100
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  METRICS_PORT: "9100"
