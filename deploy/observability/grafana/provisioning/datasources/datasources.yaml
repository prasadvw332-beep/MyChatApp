# Grafana reads this at startup, so the data sources exist without clicking through the UI.
# The fixed uids are what the dashboard JSON refers to.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # the app database, for per-user token usage (table llm_usage). Credentials come from Grafana's
  # environment (docker-compose.yml / k8s.yaml), never from this file.
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: $GRAFANA_DB_USER
    editable: false
    jsonData:
      database: mychatapp
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 2   # dashboards only: never compete with the app for connections
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # service map + request metrics from Tempo's metrics generator (written into Prometheus)
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
      # "Logs for this span" in a trace -> the lines the backend/workers wrote for the same trace.
      # $$ is a literal $: Grafana would otherwise read ${...} as an environment variable.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service=~"backend|worker"} | trace_id="$${__trace.traceId}"'
      search:
        hide: false

  # every container's output, shipped by Alloy (deploy/observability/alloy-*.alloy)
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # a JSON line with a trace id gets a "Tempo" button that opens the trace
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":\s*"(\w+)"'
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace in Tempo
