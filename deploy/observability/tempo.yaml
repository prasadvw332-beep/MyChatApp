# Grafana Tempo: stores traces (single binary, local disk) and serves them to Grafana.
#
# The metrics generator turns spans into request-rate/latency metrics per service and a service
# graph (who calls whom), written into Prometheus. That is what draws Grafana's service map.

stream_over_http_enabled: true
server:
  http_listen_port: 3200   # Grafana queries here

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # the collector sends here

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h   # keep traces for 7 days

storage:
  trace:
    backend: local          # on AWS: s3
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
