# Prometheus for Kubernetes. Same jobs as prometheus.yml (compose).
#
# The names are headless Services (k8s.yaml): unlike a normal Service, which hides its pods behind
# one IP, a headless Service's DNS name returns every pod's IP, so Prometheus scrapes each pod.
# (The alternative, kubernetes_sd_configs, needs RBAC permission to watch the Kubernetes API.)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    dns_sd_configs:
      - names: [backend-metrics.mychatapp.svc.cluster.local]
        type: A
        port: 9100

  - job_name: worker
    dns_sd_configs:
      - names: [worker-metrics.mychatapp.svc.cluster.local]
        type: A
        port: 9100

  # ---------- data stores ----------
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: qdrant
    static_configs:
      - targets: [qdrant:6333]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]

  - job_name: minio-bucket
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: [minio:9000]

  # ---------- the telemetry pipeline ----------
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
