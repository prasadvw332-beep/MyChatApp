# Run the whole app with ONE command (from the project root):
#   docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:8080   (Grafana: http://localhost:3000, Prometheus: http://localhost:9090)
# Logs of every container: Grafana -> Explore -> Loki, or Drilldown -> Logs
#
# Compose is the "small brother" of Kubernetes: it runs several containers on one
# machine and connects them on a private network where each service name
# (backend, postgres, qdrant, ...) is also its hostname.
# Compare each service here with its file in deploy/k8s/ to see how the ideas map.

services:
  # Note: ":latest" is fine for learning; real deployments pin exact versions
  # (e.g. qdrant/qdrant:v1.x.y) so a rebuild never silently changes what runs.

  # ---------- our two images (built from the Dockerfiles) ----------
  frontend:
    build: ../frontend
    ports:
      - "8080:80"            # host port 8080 -> container port 80 (nginx)
    depends_on:
      - backend

  backend:
    build: ../backend
    # no "ports": only the frontend (nginx) talks to it, over the internal network
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mychatapp
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      CORS_ORIGINS: http://localhost:8080
      JWT_SECRET: change-me-to-a-long-random-string
      # traces -> the collector (see "observability" below); metrics are scraped from port 9100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_FORMAT: json   # one JSON object per line: Alloy reads the level and ids for Loki
      OTEL_SERVICE_NAME: mychatapp-backend
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      ollama:
        condition: service_started

  # Ingestion workers: same image as the backend, different command, 3 copies.
  # Queue a folder:  docker compose -f deploy/docker-compose.yml run --rm -v D:/my-docs:/docs worker python -m app.ingestion.cli /docs
  worker:
    build: ../backend
    command: ["python", "-m", "app.ingestion.worker"]
    deploy:
      replicas: 3
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mychatapp
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: mychatapp-worker
      LOG_FORMAT: json
    stop_grace_period: 5m   # time to finish the current document on `docker compose down`
    depends_on:
      - backend             # the backend runs the database migrations at startup

  # ---------- the services the backend depends on (public images) ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mychatapp
    volumes:
      - postgres-data:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: pgsty/minio:latest   # same image as in the README
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_PROMETHEUS_AUTH_TYPE: public   # /minio/v2/metrics/* without a token; port 9000 is not published
    ports:
      - "9001:9001"          # MinIO web console, handy for looking at uploaded files
    volumes:
      - minio-data:/data

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: 3        # one request per worker at the same time
      OLLAMA_MAX_LOADED_MODELS: 2   # chat + embedding model both stay loaded
    volumes:
      - ollama-data:/root/.ollama   # downloaded models live here

  # One-off job: download the models into Ollama, then exit.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434   # the CLI talks to the ollama service
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull llama3.2:1b && ollama pull nomic-embed-text"]
    depends_on:
      - ollama
    restart: "no"

  # Synthetic users, so the Grafana dashboard has something to show (deploy/loadgen/loadgen.py).
  # Not started by a plain `up`:  docker compose -f deploy/docker-compose.yml --profile demo up -d loadgen
  loadgen:
    profiles: [demo]
    image: python:3.12-slim
    command: ["python", "-u", "/loadgen/loadgen.py"]
    environment:
      LOADGEN_URL: http://frontend/api   # through nginx, like a browser
      LOADGEN_USERS: 3
      LOADGEN_USER: loadgen
      LOADGEN_PASSWORD: loadgen-demo-password   # a throwaway local account the script registers itself
      LOADGEN_INGEST_EVERY: 600                  # queue a generated story every 10 min; 0 = never
    volumes:
      - ./loadgen:/loadgen:ro
    depends_on:
      - frontend
    restart: unless-stopped

  # ---------- Kafka: bucket events buffered in a topic (backend/app/ingestion/kafka_consumer.py) ----------
  # Not started by a plain `up`:  docker compose -f deploy/docker-compose.yml --profile kafka up -d
  # Then point MinIO at it once (the commands are at the top of kafka_consumer.py).
  # One broker in KRaft mode (Kafka's own consensus, no ZooKeeper): fine for learning. Production runs
  # 3+ brokers with replication factor 3, so a broker can fail without losing events (or a managed
  # Kafka: Amazon MSK, Confluent Cloud; in Kubernetes the Strimzi operator).
  kafka:
    profiles: [kafka]
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # one process does both (no separate controllers)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092   # the address clients are told to use
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1         # one broker: no replicas possible
      KAFKA_NUM_PARTITIONS: 3                           # new topics: up to 3 consumers in parallel
      KAFKA_LOG_RETENTION_HOURS: 168                    # events kept 7 days: room for an outage, and replays
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Same image as the workers, another command; scale up to the topic's partition count (3)
  kafka-consumer:
    profiles: [kafka]
    build: ../backend
    command: ["python", "-m", "app.ingestion.kafka_consumer"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mychatapp
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      QDRANT_URL: http://qdrant:6333        # deletes remove chunks
      OLLAMA_URL: http://ollama:11434
      LOG_FORMAT: json
    stop_grace_period: 2m                   # finish the current event, commit, leave the group
    depends_on:
      - kafka
      - worker                              # nothing would index what it queues

  # ---------- vLLM: an open model on an NVIDIA GPU (deploy/k8s/gpu/vllm.yaml explains the flags) ----------
  # Not started by a plain `up`:  docker compose -f deploy/docker-compose.yml --profile gpu up -d vllm
  # Needs an NVIDIA GPU with the NVIDIA Container Toolkit (Docker Desktop: WSL2 + a recent driver).
  # Backend: VLLM_URL=http://vllm:8000/v1 ROUTER_LARGE_MODEL=Qwen/Qwen2.5-7B-Instruct-AWQ LLM_ROUTER=heuristic
  vllm:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.10.1
    command: ["--model", "Qwen/Qwen2.5-7B-Instruct-AWQ", "--quantization", "awq", "--enable-prefix-caching",
              "--max-model-len", "8192", "--gpu-memory-utilization", "0.90"]
    ports:
      - "8001:8000"          # OpenAI-compatible API: http://localhost:8001/v1
    ipc: host                # PyTorch shares memory between processes
    volumes:
      - hf-cache:/root/.cache/huggingface   # model weights, downloaded once
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------- Airflow: schedules the nightly import of every source (deploy/airflow/dags/) ----------
  # Not started by a plain `up`:  docker compose -f deploy/docker-compose.yml --profile airflow up -d
  # UI: http://localhost:8081  (no login: local learning only). Airflow only schedules and watches;
  # each import runs in a throwaway container from the worker image, the worker pool does the indexing.

  # Airflow keeps its own state (runs, task history) in a separate database of the same PostgreSQL.
  airflow-db-init:
    profiles: [airflow]
    image: postgres:17-alpine
    environment:
      PGPASSWORD: postgres
    entrypoint: ["sh", "-c", "psql -h postgres -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'airflow'\" | grep -q 1 || psql -h postgres -U postgres -c 'CREATE DATABASE airflow'"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # DockerOperator starts containers through the Docker API. Rather than giving Airflow the Docker
  # socket itself (= root on the host), it talks to this proxy, which allows only what it needs.
  docker-proxy:
    profiles: [airflow]
    image: tecnativa/docker-socket-proxy:v0.3.0
    environment:
      CONTAINERS: 1   # create, start, follow logs, wait for, remove
      IMAGES: 1       # check that the worker image exists
      POST: 1         # allow changes (creating containers), not only reads
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  airflow:
    profiles: [airflow]
    image: apache/airflow:3.1.0
    command: standalone   # API server, scheduler, DAG processor and triggerer in one container
    ports:
      - "8081:8080"          # 8080 is the chatbot
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # everyone is admin, no login page
      DOCKER_HOST: tcp://docker-proxy:2375
      # read by the DAG: which image to run the import in, and which network it joins
      INGEST_IMAGE: ${COMPOSE_PROJECT_NAME}-worker          # the image compose builds for "worker"
      INGEST_NETWORK: ${COMPOSE_PROJECT_NAME}_default
      # handed down to the import container (PASS_THROUGH in the DAG)
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mychatapp
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      # source credentials, from your shell or a deploy/.env file; unset = S3 reads the local MinIO
      S3_SOURCE_ENDPOINT: ${S3_SOURCE_ENDPOINT:-}
      S3_SOURCE_ACCESS_KEY: ${S3_SOURCE_ACCESS_KEY:-}
      S3_SOURCE_SECRET_KEY: ${S3_SOURCE_SECRET_KEY:-}
      S3_SOURCE_SECURE: ${S3_SOURCE_SECURE:-}
      SHAREPOINT_TENANT_ID: ${SHAREPOINT_TENANT_ID:-}
      SHAREPOINT_CLIENT_ID: ${SHAREPOINT_CLIENT_ID:-}
      SHAREPOINT_CLIENT_SECRET: ${SHAREPOINT_CLIENT_SECRET:-}
      CONFLUENCE_EMAIL: ${CONFLUENCE_EMAIL:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      AZURE_STORAGE_SAS_TOKEN: ${AZURE_STORAGE_SAS_TOKEN:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_HISTORY_DAYS: ${SLACK_HISTORY_DAYS:-}
      SQL_SOURCE_URL: ${SQL_SOURCE_URL:-}
      WEB_MAX_PAGES: ${WEB_MAX_PAGES:-}
      # Google Drive needs its key file inside the import container: not wired up here
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
      worker:
        condition: service_started   # nothing would index what the imports queue

  # ---------- observability (configs in deploy/observability/) ----------
  # metrics: backend/worker :9100/metrics, postgres-exporter, qdrant, minio, the stack itself <- Prometheus -> Grafana
  # alerts:  observability/alerts.yml, evaluated by Prometheus (http://localhost:9090/alerts)
  # traces:  backend/worker --OTLP-->  otel-collector  -> Tempo       -> Grafana
  # logs:    every container's stdout  -> Alloy (docker socket) -> Loki -> Grafana
  # Versions are pinned: a dashboard or config that works today keeps working after a rebuild.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo

  # Tempo and Loki run as user 10001, but a new named volume belongs to root: hand them over once.
  volume-init:
    image: &tempo-image grafana/tempo:2.8.1
    user: root
    entrypoint: ["chown", "-R", "10001:10001", "/var/tempo", "/loki"]
    volumes:
      - tempo-data:/var/tempo
      - loki-data:/loki
    restart: "no"

  tempo:
    image: *tempo-image
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      volume-init:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    depends_on:
      volume-init:
        condition: service_completed_successfully

  # Tails every compose container's output through the Docker socket (read-only) and pushes it to Loki.
  # On Docker Desktop for Windows/Mac the socket path is the same: it is inside Docker's Linux VM.
  alloy:
    image: grafana/alloy:v1.10.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}   # read only this project's containers (alloy-compose.alloy)
    ports:
      - "12345:12345"        # Alloy's UI: the pipeline graph and the health of each step
    volumes:
      - ./observability/alloy-compose.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data   # read positions: a restart resumes instead of re-sending
    depends_on:
      - loki

  # PostgreSQL has no /metrics of its own: this reads its statistics views and serves them on :9187
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/mychatapp?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver   # Tempo writes its service-graph metrics here
      - --enable-feature=exemplar-storage    # links from a latency spike to an example trace
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # log in as admin to edit
      GF_AUTH_ANONYMOUS_ENABLED: "true"                              # everyone else can look
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mychatapp.json
      GF_METRICS_ENABLED: "true"           # Grafana's own /metrics, for the "Telemetry pipeline" row
      GRAFANA_DB_USER: postgres            # per-user token usage (llm_usage table)
      GRAFANA_DB_PASSWORD: postgres
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

# Named volumes: managed by Docker, kept until you run `docker compose down -v`
volumes:
  postgres-data:
  qdrant-data:
  minio-data:
  ollama-data:
  tempo-data:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:
  hf-cache:
  kafka-data:
